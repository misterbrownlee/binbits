# PLUGINS.yml
#
# Registry of external Claude Code plugins / skills installed on this machine.
# Custom skills (the ones we authored ourselves) live in claudebits/skills/ and
# are installed via commands/install.sh — they are not listed here.
#
# This file is updated manually. When you install or remove a plugin, edit this
# file so that future-you (on a new machine) has a checklist to replicate the
# setup.
#
# Format:
#   plugins:
#     - id: <plugin-id>            required — the plugin's identifier
#       description: <text>        required — one-line summary
#       install: <command>         required — exact command to install
#       skills:                    optional — skill names exposed by the plugin
#         - <skill-name>

plugins:
  - id: anthropic-skills
    description: Anthropic-provided skill bundle (document, scheduling, memory, skill authoring)
    install: # TODO: confirm exact install command (e.g. `/plugin install anthropic-skills`)
    skills:
      - schedule           # /anthropic-skills:schedule
      - consolidate-memory # /anthropic-skills:consolidate-memory
      - skill-creator      # /anthropic-skills:skill-creator
      - pdf                # /anthropic-skills:pdf
      - pptx               # /anthropic-skills:pptx
      - docx               # /anthropic-skills:docx
      - xlsx               # /anthropic-skills:xlsx
      - setup-cowork       # /anthropic-skills:setup-cowork

  - id: compound-engineering
    description: |
      AI-assisted development methodology by Every.to. Implements the Plan→Work→Review→Compound
      loop with 26 specialized agents, 23 workflow commands, and 13 skills. The core idea:
      each unit of engineering work should make subsequent work easier — bug fixes eliminate
      bug categories, patterns become reusable tools, solutions get codified as institutional
      knowledge. See: https://every.to/guides/compound-engineering
    install: |
      claude /plugin marketplace add https://github.com/EveryInc/every-marketplace
      claude /plugin install compound-engineering
    commands:
      - /workflows:brainstorm  # clarify fuzzy requirements via guided questioning
      - /workflows:plan        # spawn parallel research agents → structured implementation plan
      - /workflows:work        # execute plan in isolation (Git worktree), run quality checks
      - /workflows:review      # 14+ parallel specialized reviewers (security, perf, arch, data…)
      - /workflows:compound    # capture patterns into CLAUDE.md + searchable docs/solutions/
      - /lfg                   # end-to-end: plan → work → review → resolve → PR (50+ agents)
